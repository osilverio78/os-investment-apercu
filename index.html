<html lang="fr">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="only light"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Investment — site</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Red+Hat+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FEF9ED}
a{color:#23324D}a:hover{color:#23324D;text-decoration-color:#E9A36B}
html{scroll-behavior:smooth}
.os-root{font-size:16px}
.os-root.os-big{font-size:19px}
.os-mono{font-family:'Red Hat Mono',ui-monospace,monospace;font-weight:500}
.os-link{text-decoration:none}
.os-link:hover{text-decoration:underline;text-decoration-color:#E9A36B;text-underline-offset:4px}
.os-row:hover .os-rowtitle{text-decoration:underline;text-decoration-color:#E9A36B;text-underline-offset:5px}
.os-row:focus-visible,.os-btn:focus-visible,.os-tag:focus-visible{outline:2px solid #23324D;outline-offset:2px}
.os-input{font:inherit;font-size:1em;color:#23324D;background:#FEF9ED;border:1px solid rgba(35,50,77,0.28);border-radius:5px;padding:14px 16px;width:100%;box-sizing:border-box}
.os-input:focus{outline:2px solid #23324D;outline-offset:1px}
.os-node{transition:scale .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,background-color .45s,color .45s}
.os-node:hover,.os-node:focus-visible{scale:1.13;box-shadow:0 22px 44px -22px rgba(35,50,77,.55);outline:none;z-index:3}
.os-ray{transition:background-color .4s,height .4s,opacity .4s}
.os-center{transition:box-shadow .5s}
.os-card{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .55s,background-color .55s;will-change:transform}
.os-card:hover{--ty:-8px;box-shadow:0 30px 55px -30px rgba(35,50,77,.5);background-color:#F4E3C8 !important}
.os-spot{position:relative;overflow:hidden;isolation:isolate}
.os-spot::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(233,163,107,.28),transparent 62%);opacity:0;transition:opacity .45s;pointer-events:none}
.os-spot:hover::before{opacity:1}
.os-progress{position:fixed;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:#E39A5C;z-index:60;pointer-events:none}
@keyframes osProg{to{transform:scaleX(1)}}

.os-word{display:inline-block;margin-right:.26em;opacity:0;animation:osWord 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes osWord{from{opacity:0;transform:translateY(.45em);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.os-spin{animation:osSpin 90s linear infinite}
@keyframes osSpin{to{rotate:360deg}}
.os-marquee{display:flex;width:max-content;animation:osMarq 48s linear infinite}
@keyframes osMarq{to{transform:translateX(-50%)}}
.os-flow{animation:osFlow 7s linear infinite}
@keyframes osFlow{to{stroke-dashoffset:-16}}
.os-float{animation:osFloat 7s ease-in-out infinite}
@keyframes osFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.os-row{background-image:linear-gradient(#F7ECD9,#F7ECD9) !important;background-size:0% 100% !important;background-repeat:no-repeat !important;transition:background-size .55s cubic-bezier(.2,.8,.2,1) !important}
.os-row:hover{background-size:100% 100% !important}
.os-chip{transition:background-color .35s,color .35s,transform .35s}
.os-chip:hover{background-color:#23324D;color:#FEF9ED;transform:translateY(-3px)}
.os-tag{transition:background-color .3s,color .3s,transform .3s}
.os-tag:hover{transform:translateY(-2px)}
.os-input{transition:border-color .3s,box-shadow .3s}
.os-input:hover{border-color:rgba(35,50,77,.5)}
.os-card .os-num{transition:color .4s}
.os-card:hover .os-num{color:#C9773A}
.os-zoom svg{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.os-jr:hover .os-zoom svg{transform:scale(1.08)}
.os-jr h3{transition:color .3s}
.os-jr:hover h3{color:#3A4A66}
.os-arr{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.os-row:hover .os-arr{transform:translateX(8px)}
.os-cta svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.os-cta:hover svg{transform:translateX(4px)}
.os-cta{transition:background-color .3s}
.os-cta:hover{background-color:#2F4266 !important}
.os-portrait img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.os-portrait:hover img{transform:scale(1.025)}
@keyframes osTitle{from{opacity:0;clip-path:inset(0 0 100% 0);translate:0 .35em;filter:blur(8px)}to{opacity:1;clip-path:inset(0 0 -20% 0);translate:0 0;filter:blur(0)}}
@keyframes osSlide{from{translate:9% 0}to{translate:-6% 0}}
@keyframes osSunIn{from{opacity:0;scale:.78;filter:blur(6px)}to{opacity:1;scale:1;filter:blur(0)}}
@keyframes osPara{from{translate:0 34px}to{translate:0 -34px}}
@keyframes osBand{from{opacity:.4;letter-spacing:.2em}to{opacity:1;letter-spacing:0}}
.os-aurora{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:osDrift 18s ease-in-out infinite alternate}
@keyframes osDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,-8%) scale(1.12)}100%{transform:translate(-5%,6%) scale(.94)}}
.os-globe{animation:osGlobe 9s ease-in-out infinite;transform-origin:50% 50%}
@keyframes osGlobe{0%,100%{transform:perspective(160px) rotateY(-28deg) rotateX(6deg)}50%{transform:perspective(160px) rotateY(28deg) rotateX(-6deg)}}
.os-qt{view-timeline-name:--osq}
@keyframes osQw{from{opacity:.16}to{opacity:1}}

@keyframes osUp{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}

@media (prefers-reduced-motion: reduce){.os-node,.os-card,.os-zoom svg,.os-arr,.os-cta svg,.os-portrait img{transition:none !important}.os-spin,.os-float,.os-aurora,.os-globe{animation:none !important}}
@media (max-width: 720px){
  .os-sun{aspect-ratio:auto !important;display:flex !important;flex-direction:column !important;gap:18px !important}
  .os-ray,.os-orbit,.os-rays{display:none !important}
  .os-center{position:static !important;translate:none !important;width:100% !important;aspect-ratio:auto !important;border-radius:14px !important;padding:28px 20px !important}
  .os-nodes{position:static !important;display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
  .os-node{position:static !important;translate:none !important;width:auto !important;aspect-ratio:auto !important;border-radius:999px !important;padding:14px 10px !important;font-size:15px !important}
}
@media (max-width: 900px){
  .os-navlinks{display:none !important}
  .os-g3{grid-template-columns:minmax(0,1fr) !important}
  .os-g2{grid-template-columns:minmax(0,1fr) !important}
  .os-g4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .os-const{height:auto !important;display:flex !important;flex-direction:column !important;gap:28px !important}
  .os-const svg{display:none !important}
  .os-tiles{position:static !important;display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
  .os-tile{position:static !important;width:auto !important;transform:none !important;aspect-ratio:auto !important;min-height:72px !important}
  .os-labels{position:static !important;display:flex !important;flex-wrap:wrap !important;justify-content:center !important;gap:8px 18px !important}
  .os-label{position:static !important;transform:none !important}
  .os-rowgrid{grid-template-columns:minmax(0,1fr) 28px !important}
  .os-hide-m{display:none !important}
  .os-tl{grid-template-columns:minmax(0,1fr) !important;gap:6px !important}
  .os-panel{width:100% !important}
}
</style>

<style>
.js-anim .os-reveal{opacity:0;translate:0 44px;transition:opacity 1s cubic-bezier(.2,.8,.2,1),translate 1.1s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .55s,background-color .55s}

<template id="tpl">
<div class="{{rootClass}}" style="background: #FEF9ED; color: #23324D; font-family: 'Newsreader', Georgia, serif; font-weight: 400; min-height: 100vh;">

  <header style="position: sticky; top: 0; z-index: 20; padding: 14px 16px; box-sizing: border-box;">

  <main id="top">

    <section aria-labelledby="hero-text" style="position: relative; overflow: hidden; padding: 220px 24px 110px; box-sizing: border-box;">
      <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">{{t.h1}}</h1>
      <div class="os-aurora" aria-hidden="true" style="width: 46vw; height: 46vw; max-width: 720px; max-height: 720px; left: -8%; top: 4%; background: radial-gradient(circle, rgba(233,163,107,0.55), rgba(233,163,107,0) 68%);"></div>
      <div class="os-aurora" aria-hidden="true" style="animation-delay: -7s; width: 40vw; height: 40vw; max-width: 640px; max-height: 640px; right: -6%; top: 22%; background: radial-gradient(circle, rgba(106,151,200,0.45), rgba(106,151,200,0) 68%);"></div>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 56px;">
        <p id="hero-text" style="margin: 0; max-width: 14em; font-size: clamp(32px, 4.6vw, 80px); line-height: 1.12; letter-spacing: -0.015em;"><sc-for list="{{heroWords}}" as="hw" hint-placeholder-count="9"><span class="os-word" style="animation-delay: {{hw.d}};">{{hw.w}}</span></sc-for></p>
        <div style="display: flex; gap: 4px; align-items: stretch;">
          <a href="#missions" class="os-mono os-cta" style="text-decoration: none; background: #23324D; color: #FEF9ED; border-radius: 24px; padding: 13px 38px; font-size: 0.76em; display: flex; align-items: center;">{{t.heroBtn}}</a>
          <a href="#missions" class="os-cta" aria-label="{{t.heroBtn}}" style="text-decoration: none; background: #23324D; color: #FEF9ED; border-radius: 4px; width: 42px; min-height: 42px; display: flex; align-items: center; justify-content: center;">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
        </div>
      </div>
    </section>

    <div class="os-marq-wrap os-band" aria-hidden="true" style="background: #23324D; color: #FEF9ED; overflow: hidden; border-top: 1px solid rgba(35,50,77,0.14); border-bottom: 1px solid rgba(35,50,77,0.14); padding: 22px 0; margin-bottom: 70px;">
      <div class="os-marquee">
        <sc-for list="{{marquee}}" as="mq" hint-placeholder-count="20">
          <span style="display: inline-flex; align-items: center; gap: 34px; padding-right: 34px; font-size: clamp(22px, 2.4vw, 40px); font-style: italic; white-space: nowrap;">{{mq.l}}<span style="width: 7px; height: 7px; border-radius: 50%; background: #E39A5C; display: inline-block;"></span></span>
        </sc-for>
      </div>
    </div>

    <section aria-label="{{t.constAria}}" style="padding: 20px 24px 130px; box-sizing: border-box;">
      <div class="os-sun os-sunin" style="position: relative; width: min(1040px, 100%); aspect-ratio: 1 / 1; margin: 0 auto;">
        <svg class="os-rays" aria-hidden="true" viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;">
          <sc-for list="{{rayList}}" as="rl" hint-placeholder-count="10">
            <path class="{{rl.cls}}" d="{{rl.d}}" fill="none" stroke="{{rl.c}}" stroke-opacity="{{rl.o}}" stroke-width="{{rl.w}}" stroke-linecap="round" stroke-dasharray="{{rl.da}}"><animate attributeName="d" dur="{{rl.dur}}" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="{{rl.v}}"></animate></path>
          </sc-for>
        </svg>
        <div class="os-center" aria-live="polite" style="position: absolute; left: 50%; top: 50%; width: 27%; aspect-ratio: 1 / 1; translate: -50% -50%; border-radius: 50%; background: #23324D; color: #FEF9ED; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 4%; box-sizing: border-box; box-shadow: 0 0 0 10px rgba(35,50,77,0.06), 0 30px 60px -30px rgba(35,50,77,0.6); z-index: 2;">
          <span style="font-size: clamp(18px, 2.1vw, 30px); line-height: 1.1;">{{sunTitle}}</span>
          <span class="os-mono" style="font-size: clamp(10px, 0.85vw, 12.5px); line-height: 1.45; color: #E9DCC3; max-width: 16em;">{{sunDesc}}</span>
        </div>
        <ul class="os-nodes" aria-label="{{t.constAria}}" style="list-style: none; margin: 0; padding: 0; position: absolute; inset: 0;">
          <sc-for list="{{sunNodes}}" as="nd" hint-placeholder-count="10">
            <li style="display: contents;">
              <a href="#missions" class="os-node os-float" onMouseEnter="{{nd.enter}}" onMouseLeave="{{nd.leave}}" onFocus="{{nd.enter}}" onBlur="{{nd.leave}}" style="animation-delay: {{nd.delay}}; position: absolute; left: {{nd.x}}; top: {{nd.y}}; width: 13.5%; aspect-ratio: 1 / 1; translate: -50% -50%; border-radius: 50%; background: {{nd.bg}}; color: {{nd.fg}}; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2%; box-sizing: border-box; text-decoration: none; font-size: clamp(12px, 1.2vw, 17px); line-height: 1.15; border: 1px solid {{nd.border}};">{{nd.label}}</a>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>

    <section id="missions" aria-labelledby="mis-title" style="padding: 130px 24px 80px; box-sizing: border-box;">
      <div style="max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 80px;">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 36px;">
          <h2 id="mis-title" class="os-h2" style="margin: 0; max-width: 8em; font-weight: 400; font-size: clamp(38px, 4.2vw, 72px); line-height: 1.1; letter-spacing: -0.01em;">{{t.misTitle}}</h2>
        </div>
        <ul class="os-g3" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
          <sc-for list="{{t.domains}}" as="d" hint-placeholder-count="6">
            <li class="os-card os-spot os-reveal" onMouseMove="{{spot}}" onMouseLeave="{{unspot}}" style="background: #F7ECD9; border-radius: 5px; padding: 28px 28px 34px; display: flex; flex-direction: column;">
              <span class="os-mono os-num" style="font-size: 0.8em; margin-bottom: 64px;">{{d.n}}</span>
              <h3 style="margin: 0 0 0.3em; font-weight: 400; font-size: clamp(26px, 2.2vw, 36px); line-height: 1.1; letter-spacing: -0.01em;">{{d.t}}</h3>
              <p style="margin: 0 0 1.4em; font-style: italic; font-size: 1.15em; line-height: 1.35;">{{d.s}}</p>
              <ul style="margin: 0; padding-left: 1.05em; display: flex; flex-direction: column; gap: 0.55em; font-size: 1.08em; line-height: 1.4;">
                <sc-for list="{{d.b}}" as="li" hint-placeholder-count="4">
                  <li>{{li}}</li>
                </sc-for>
              </ul>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>

    <section id="cabinet" aria-label="{{t.ruleLabel}}" style="padding: 0 24px 100px; box-sizing: border-box;">
      <div style="max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px;">
        <div class="os-g2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;">
          <p class="os-card os-spot os-reveal" onMouseMove="{{spot}}" onMouseLeave="{{unspot}}" style="margin: 0; background: #F2EADB; border-radius: 5px; padding: 26px 28px; font-size: 1.05em; line-height: 1.55;"><span class="os-mono os-num" style="display: block; font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;">{{t.ruleLabel}}</span>{{t.rule}}</p>
          <p class="os-card os-spot os-reveal" onMouseMove="{{spot}}" onMouseLeave="{{unspot}}" style="margin: 0; background: #F2EADB; border-radius: 5px; padding: 26px 28px; font-size: 1.05em; line-height: 1.55;"><span class="os-mono os-num" style="display: block; font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;">{{t.feesLabel}}</span>{{t.fees}}</p>
        </div>
      </div>
    </section>

    <section id="situations" aria-labelledby="sit-title" style="overflow-x: clip; padding: 130px 24px; box-sizing: border-box;">
      <div style="max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px;">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 36px;">
          <h2 id="sit-title" class="os-slide" style="margin: 0; white-space: nowrap; font-weight: 400; font-size: clamp(56px, 8.2vw, 150px); line-height: 1; letter-spacing: -0.02em;">{{t.sitTitle}}</h2>
          <label style="display: flex; align-items: center; gap: 10px; background: #F2EADB; border-radius: 999px; padding: 0 18px; width: min(320px, 100%); box-sizing: border-box;">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23324D" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">{{t.searchLabel}}</span>
            <input class="os-mono" type="search" value="{{q}}" onInput="{{onSearch}}" placeholder="{{t.searchPh}}" style="border: 0; background: transparent; font-size: 0.82em; padding: 13px 0; width: 100%; color: #23324D; outline: none;">
          </label>
          <div role="group" aria-label="{{t.filterAria}}" style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
              <button class="os-tag os-mono" type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="cursor: pointer; border: 0; border-radius: 3px; padding: 8px 12px; min-height: 36px; font-size: 0.74em; text-transform: uppercase; letter-spacing: 0.04em; background: {{c.bg}}; color: {{c.fg}};">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 0 14px;">
            <h3 style="margin: 0; font-weight: 400; font-size: clamp(26px, 2.2vw, 36px);">{{t.casTitle}}</h3>
            <span class="os-mono" style="font-size: 0.86em;" aria-live="polite">{{countLabel}}</span>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(35,50,77,0.85);">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="15">
              <li style="border-bottom: 1px solid rgba(35,50,77,0.85);">
                <button class="os-row" type="button" onClick="{{r.open}}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: block; padding: 12px 0;">
                  <span class="os-rowgrid" style="display: grid; grid-template-columns: minmax(0, 1fr) 300px 28px; gap: 16px; align-items: center;">
                    <span class="os-rowtitle" style="font-family: 'Newsreader', Georgia, serif; font-size: 1.32em; color: #23324D;">{{r.t}}</span>
                    <span class="os-mono os-hide-m" style="font-size: 0.86em; color: #23324D;">{{r.catLabel}}</span>
                    <span aria-hidden="true" class="os-arr" style="justify-self: end; color: #23324D;">→</span>
                  </span>
                </button>
              </li>
            </sc-for>
          </ul>
          <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
            <div style="padding: 48px 0; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center;">
              <p style="margin: 0; font-size: 1.3em;">{{t.noResult}}</p>
              <button class="os-btn os-mono" type="button" onClick="{{reset}}" style="cursor: pointer; border: 0; background: #23324D; color: #FEF9ED; border-radius: 24px; padding: 12px 28px; min-height: 44px; font-size: 0.76em;">{{t.reset}}</button>
            </div>
          </sc-if>
        </div>
      </div>
    </section>

        <ul class="os-g3" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
          <sc-for list="{{t.cacItems}}" as="ci" hint-placeholder-count="6">
            <li class="os-card os-spot os-reveal" onMouseMove="{{spot}}" onMouseLeave="{{unspot}}" style="background: #F7ECD9; border-radius: 5px; padding: 26px 26px 30px; display: flex; flex-direction: column; gap: 10px;">
              <span class="os-mono os-num" style="font-size: 0.78em; margin-bottom: 36px;">{{ci.n}}</span>
              <h3 style="margin: 0; font-weight: 400; font-size: 1.6em; line-height: 1.15;">{{ci.t}}</h3>
              <p style="margin: 0; font-size: 1.04em; line-height: 1.45;">{{ci.d}}</p>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>

    <section id="journal" aria-labelledby="jr-title" style="padding: 60px 24px 130px; box-sizing: border-box;">
      <div style="max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid rgba(35,50,77,0.85); padding-bottom: 14px;">
          <h2 id="jr-title" class="os-mono" style="margin: 0; font-size: 0.86em; font-weight: 500;">{{t.jrTitle}}</h2>
          <span class="os-mono" style="font-size: 0.86em;">{{t.jrSoon}}</span>
        </div>
        <ul class="os-g3" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
          <sc-for list="{{t.notes}}" as="nt" hint-placeholder-count="3">
            <li class="os-jr os-reveal" style="display: flex; flex-direction: column; gap: 14px;">
              <button type="button" onClick="{{nt.open}}" aria-label="{{nt.t}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 14px;">
              <div class="os-zoom" aria-hidden="true" style="aspect-ratio: 16 / 10; border-radius: 2px; background: {{nt.bg}}; position: relative; overflow: hidden;">
                <svg viewBox="0 0 400 250" style="position: absolute; inset: 0; width: 100%; height: 100%;" fill="none" stroke="{{nt.ink}}" stroke-width="1.2">
                  <circle cx="{{nt.cx}}" cy="125" r="78"></circle><path d="M30 210 C130 150 250 230 370 90"></path>
                </svg>
              </div>
              <h3 style="margin: 0; font-weight: 400; font-size: 1.45em; line-height: 1.25;">{{nt.t}}</h3>
              <span class="os-mono" style="font-size: 0.78em;">{{nt.tag}} · {{nt.r}} · <span style="text-decoration: underline; text-decoration-color: #E9A36B; text-underline-offset: 4px;">{{t.readNote}}</span></span>
              </button>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>

    <section id="contact" aria-labelledby="ct-title" style="padding: 130px 24px 150px; box-sizing: border-box; background: #F7ECD9;">
      <div class="os-g2" style="max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 72px;">
        <div style="display: flex; flex-direction: column; gap: 28px;">
          <h2 id="ct-title" class="os-h2" style="margin: 0; font-weight: 400; font-size: clamp(44px, 5vw, 88px); line-height: 1; letter-spacing: -0.02em;">{{t.ctTitle}}</h2>
          <p style="margin: 0; font-size: clamp(18px, 1.5vw, 24px); line-height: 1.5;">{{t.ctText}}</p>
        </div>
        <div>
          <sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
            <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 18px;">
              <div class="os-g2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
                <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fName}}</span><input class="os-input" type="text" name="name" autocomplete="name" required=""></label>
                <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fCompany}}</span><input class="os-input" type="text" name="company" autocomplete="organization"></label>
                <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fEmail}}</span><input class="os-input" type="email" name="email" autocomplete="email" required=""></label>
                <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fPhone}}</span><input class="os-input" type="tel" name="phone" autocomplete="tel"></label>
              </div>
              <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fSituation}}</span>
                <select class="os-input" name="situation"><sc-for list="{{t.optSituation}}" as="o" hint-placeholder-count="5"><option>{{o}}</option></sc-for></select>
              </label>
              <div class="os-g2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
                <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fSize}}</span>
                  <select class="os-input" name="size"><sc-for list="{{t.optSize}}" as="o" hint-placeholder-count="4"><option>{{o}}</option></sc-for></select>
                </label>
                <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fHorizon}}</span>
                  <select class="os-input" name="horizon"><sc-for list="{{t.optHorizon}}" as="o" hint-placeholder-count="3"><option>{{o}}</option></sc-for></select>
                </label>
              </div>
              <label style="display: flex; flex-direction: column; gap: 8px;"><span class="os-mono" style="font-size: 0.76em;">{{t.fMessage}}</span><textarea class="os-input" name="message" rows="5"></textarea></label>
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
                <span style="font-size: 1em; font-style: italic; max-width: 340px;">{{t.fNote}}</span>
                <div style="display: flex; gap: 4px;">
                  <button class="os-btn os-mono" type="submit" style="cursor: pointer; border: 0; background: #23324D; color: #FEF9ED; border-radius: 24px; padding: 13px 38px; min-height: 44px; font-size: 0.76em;">{{t.fSubmit}}</button>
                  <span aria-hidden="true" style="background: #23324D; color: #FEF9ED; border-radius: 4px; width: 44px; display: flex; align-items: center; justify-content: center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                  </span>
                </div>
              </div>
            </form>
          </sc-if>
          <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
            <div role="status" style="background: #FEF9ED; border-radius: 5px; padding: 44px 40px; display: flex; flex-direction: column; gap: 14px;">
              <span class="os-mono" style="font-size: 0.78em;">{{t.sentLabel}}</span>
              <p style="margin: 0; font-size: 1.7em; line-height: 1.3;">{{t.sentText}}</p>
            </div>
          </sc-if>
        </div>
      </div>
    </section>
  </main>

  <footer style="padding: 64px 24px 40px; box-sizing: border-box; border-top: 1px solid rgba(35,50,77,0.15);">
    <div style="max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px;">

  answer(q, lang) {

  chatVals(t, lang) {

  }

  renderVals() {
    const lang = this.state.lang || this.props.lang || "fr";
    const t = this.dict()[lang];
    const active = (this.state.sun === null || this.state.sun === undefined) ? -1 : this.state.sun;
    const n = t.labels.length;
    const spot = (e) => {
      const el = e && e.currentTarget; if (!el || !el.getBoundingClientRect) return;

        fg: on ? "#23324D" : (dark ? "#FEF9ED" : "#23324D"),
        border: dark ? "rgba(35,50,77,0)" : "rgba(35,50,77,0.18)",

    });
    const sunTitle = active >= 0 ? t.labels[active] : t.center;
    const sunDesc = active >= 0 ? t.sunDescs[active] : t.centerDesc;
    const tiles = [];
    const labels = [];
    const base = [
      ["holding","entreprise","g"],["ceder","entreprise","g"],["remu","entreprise","g"],["controle","entreprise","g"],["restructurer","entreprise","m"],["lever","entreprise","m"],["reprendre","entreprise","m"],["comptes","entreprise","a"],
      ["immo","patrimoine","g"],["ifi","patrimoine","g"],["separer","patrimoine","g"],["expat","patrimoine","g"],
      ["transmettre","famille","g"],["retraite","famille","g"],["proteger","famille","g"]

    });
    const q = (this.state.q || "").trim().toLowerCase();
    const cat = this.state.cat;
    const filtered = all.filter((r) => (cat === "all" || r.cat === cat) && (!q || (r.t + " " + r.e + " " + r.a).toLowerCase().indexOf(q) !== -1));
    const rows = filtered.map((r) => ({ ...r, open: () => this.setState({ fiche: r.id }) }));
    const catKeys = ["all", "entreprise", "patrimoine", "famille"];
    const cats = catKeys.map((k) => {
      const on = cat === k;
      return { label: k === "all" ? t.catAll : t.catNames[k], on, bg: on ? "#23324D" : "#F2EADB", fg: on ? "#FEF9ED" : "#23324D", pick: () => this.setState({ cat: k }) };
    });
    const ficheItem = all.find((r) => r.id === this.state.fiche) || null;
    const bgs = ["#23324D", "#E9DCC3", "#EFC9A5"];
    const inks = ["#EFC9A5", "#23324D", "#23324D"];
    const notes = t.notes.map((n, i) => ({ ...n, bg: bgs[i], ink: inks[i], cx: String(130 + i * 70), open: () => this.setState({ note: i }) }));
    const noteItem = (this.state.note === null || this.state.note === undefined) ? null : t.notes[this.state.note];
    const chat = this.chatVals(t, lang);
    const isFr = lang === "fr";
    const big = !!this.state.big;
    return {
      t: { ...t, notes },
      tiles,
      labels,
      sunNodes,
      rayList,
      spot,
      unspot,
      quoteWords: (() => { const ws = t.quote.split(" "); return ws.map((w, i) => ({ w, r: "cover " + (12 + i * 34 / ws.length).toFixed(1) + "% cover " + (12 + (i + 1) * 34 / ws.length + 4).toFixed(1) + "%" })); })(),
      heroWords: t.manifesto.split(" ").map((w, i) => ({ w, d: (0.15 + i * 0.08).toFixed(2) + "s" })),
      marquee: t.labels.concat(t.labels).map((l) => ({ l })),
      sunTitle,
      sunDesc,
      rows,
      cats,
      countLabel: filtered.length + t.count,
      empty: filtered.length === 0,
      q: this.state.q,
      onSearch: (e) => this.setState({ q: e && e.target ? e.target.value : "" }),
      reset: () => this.setState({ q: "", cat: "all" }),
      hasFiche: !!ficheItem,
      fiche: ficheItem || { t: "", e: "", a: "", l: "", catLabel: "", fmt: "", note: "" },
      close: () => this.setState({ fiche: null }),
      isFr,
      isEn: !isFr,
      frBg: isFr ? "#F2EADB" : "transparent",
      enBg: isFr ? "transparent" : "#F2EADB",
      setFr: () => this.setState({ lang: "fr" }),
      setEn: () => this.setState({ lang: "en" }),
      sent: this.state.sent,
      notSent: !this.state.sent,
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); },
      big,
      rootClass: big ? "os-root os-big" : "os-root",
      bigState: big ? t.on : t.off,
      bigBg: big ? "#23324D" : "#F2EADB",
      bigFg: big ? "#FEF9ED" : "#23324D",
      toggleBig: () => this.setState({ big: !this.state.big }),
      hasNote: !!noteItem,
      note: noteItem || { t: "", tag: "", r: "", lead: "", sec: [], take: "" },
      closeNote: () => this.setState({ note: null }),
      ...chat
    };
  }
}

    let attrs = "";
