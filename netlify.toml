[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# Adresse principale : https://os-investment.fr — les autres domaines y renvoient (301).
[[redirects]]
  from = "https://os-inv.fr/*"
  to = "https://os-investment.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.os-inv.fr/*"
  to = "https://os-investment.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://os-inv.fr/*"
  to = "https://os-investment.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.os-inv.fr/*"
  to = "https://os-investment.fr/:splat"
  status = 301
  force = true
